name: Deploy CAESURA to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # KI-753：重跑前需要删掉上一次 attempt 留下的 github-pages artifact

concurrency:
  group: pages
  # KI-753：串行而非抢占。并行会话连续推 commit 时，cancel-in-progress 会在
  # upload/deploy 中途掐掉上一轮，留下孤儿 artifact，deploy-pages 随即 Found 0。
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Publish tutorial + console + cast + codex + story alongside the game
        # Static, zero-dependency pages served at the same origin as the game:
        #   /caesura/console/  — 55-dim systems dashboard (真机+offline 双路)
        #   /caesura/tutorial/ — 新手入门小册子，同源静态页
        #   /caesura/cast/     — 角色图鉴 Cast Roster，双语 cast page
        #   /caesura/codex/    — 世界谱 World Codex，浏览器内 BM25 双语检索，零网络零 LLM
        #   /caesura/story/    —《盐》原创短篇（风钟海岸·听雾站），双语对照，零 LLM
        #   /caesura/admin/    — 止音后台 · 用户观察站（KI-583 · 密码 123 · 静态静态页，种子数据）
        #   /caesura/site-latest.json  — 静态版本鲜端点，可代替 raw.githubusercontent 路径
        run: |
          mkdir -p dist/console dist/tutorial dist/cast dist/codex dist/story dist/admin
          cp -R console/. dist/console/
          cp -R tutorial/. dist/tutorial/
          cp -R cast/. dist/cast/
          cp -R codex/. dist/codex/
          cp -R story/. dist/story/
          cp -R admin/. dist/admin/
          cp site-latest.json dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # KI-753：GitHub 平台偶发「Found 0 artifact(s)」，重跑又会变成
      # 「Multiple artifacts named github-pages」（上一次 attempt 的 artifact 还在）。
      # upload-pages-artifact 不会覆盖同名 artifact，deploy-pages 要求恰好一个。
      # 上传前先把本 run 里上一次 attempt 的同名 artifact 删干净，让 rerun 也稳定。
      - name: Remove stale github-pages artifact from a prior attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' || true)
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null || true
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # KI-753：upload 返回后 artifact 元数据在 GitHub API 侧偶发尚未可见（最终一致性），
      # deploy-pages 在启动时立刻查元数据就会报 Found 0 artifact(s)。等它可见再进 deploy。
      - name: Wait for artifact metadata to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "$n" = "1" ]; then echo "artifact metadata visible (attempt $i)"; exit 0; fi
            sleep 5
          done
          echo "::error::github-pages artifact still not visible after 100s"; exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
