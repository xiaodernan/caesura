name: Deploy CAESURA to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Publish tutorial + console + cast alongside the game
        # Static, zero-dependency pages served at the same origin as the game:
        #   /caesura/console/  — 55-dim systems dashboard (真机+offline 双路)
        #   /caesura/tutorial/ — 新手入门小册子，同源静态页
        #   /caesura/cast/     — 角色图鉴 Cast Roster，双语 cast page
        run: |
          mkdir -p dist/console dist/tutorial dist/cast
          cp -R console/. dist/console/
          cp -R tutorial/. dist/tutorial/
          cp -R cast/. dist/cast/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
