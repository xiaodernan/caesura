name: check

on:
  push:
    branches: [main, master, mainline]
  pull_request:
    branches: [main, master, mainline]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Lint / type-check
        run: npm run lint

      - name: Docs consistency gates
        run: node scripts/test.mjs

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
