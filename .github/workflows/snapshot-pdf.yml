name: snapshot-pdf

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-pdf
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install runtime deps
        run: npm ci

      - name: Install Playwright (no package.json pollution)
        run: |
          npm i --no-save playwright@1.65.1
          npx playwright install --with-deps chromium

      - name: Generate offline editions (PDF)
        run: node scripts/print-pages-pdf.mjs

      - name: Upload offline Editions
        uses: actions/upload-artifact@v4
        with:
          name: caesura-offline-editions
          path: dist-pdf/*.pdf
          retention-days: 30
