name: site-sync

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'chore(status): re-embed site-latest.json')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate site-latest.json
        run: |
          node scripts/build-site-latest.mjs

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet site-latest.json; then
            git config user.name 'caesura-bot'
            git config user.email 'caesura-bot@noreply.local'
            git add site-latest.json
            git commit -m 'chore(status): re-embed site-latest.json'
            # 连发两次 master 会让先后台两个 refresh job 同时落地 site-latest.json；
            # 先把自己的重嵌提交 rebase 到最新 master 上，再推——否则后一把 job 必然被非 fast-forward 拒
            git fetch origin master --depth=1
            git rebase origin/master
            git push origin HEAD:master
          else
            echo 'site-latest.json already fresh'
          fi
