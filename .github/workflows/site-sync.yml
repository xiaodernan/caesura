name: site-sync

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'chore(status): re-embed site-latest.json')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 连续推送必然让 `site-latest.json` 的基底在两次 job 之间被改写；
      # 与其 commit 出本地快照再 push（必然 add/add 冲突），
      # 不如直接在 remote-tip 上重算：checkout 到 origin/master，再生成 + commit/push
      - name: Refresh against remote tip
        run: |
          git fetch origin master --depth=1
          git reset --hard origin/master

      - name: Regenerate site-latest.json
        run: |
          node scripts/build-site-latest.mjs

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet site-latest.json; then
            git config user.name 'caesura-bot'
            git config user.email 'caesura-bot@noreply.local'
            git add site-latest.json
            git commit -m 'chore(status): re-embed site-latest.json'
            # 同样的「先 rebase 再 push」语义：这里 no-rebase（reset 让 HEAD == tip），
            # 只 needs 防止在 build 与 push 之间的极小窗口被他人推入；rebase 会 apply 一个我们算好的内容 patch
            git push origin HEAD:master || (git fetch origin master --depth=1 && git reset --hard origin/master && node scripts/build-site-latest.mjs && git add site-latest.json && git commit -m 'chore(status): re-embed site-latest.json' && git push origin HEAD:master)
          else
            echo 'site-latest.json already fresh'
          fi
