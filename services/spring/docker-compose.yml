# services/spring/docker-compose.yml —— 把五服务族一次起起来（KI-422；KI-430 补上容器形态）
#
# **先构建再起**（compose 不替你编译 jar）：
#   cd services/spring && mvn -DskipTests package
#   cd services/spring && docker compose up -d --build
#
# 仓库挂在 /workspace：门要在这个目录里跑 `npm run …` / `node scripts/…`，
# 而 node_modules 与 dist 也在里面 ⇒ 门跑的是**这份工作树**，不是容器里另装的一份。
#
# **镜像从 `Dockerfile` 构建**（KI-430）：那个镜像里**同时有 JRE 与 Node**——
# 门跑的是仓库既有的 npm／node 入口，镜像里没有 node 的话每一道门都会「起不来」。
#
# **容器里的两个地址必须改**（实测踩过）：容器里的 `127.0.0.1` 指的是**它自己**，
# 所以 ①客户端找注册中心要写 `http://caesura-registry:8761/eureka/`（compose 网络里的服务名）；
# ②注册进 Eureka 的主机名要写**服务名**（写 127.0.0.1 的话，别的容器会回连到自己身上）。
# 宿主要访问这一族仍旧走映射出来的端口（`localhost:8099`）——那是另一条路。

services:
  caesura-registry:
    build:
      context: .
      dockerfile: Dockerfile
    image: caesura/registry:0.1.0
    working_dir: /workspace/services/spring
    volumes:
      - ../..:/workspace
    command: ["java", "-jar", "caesura-registry/target/caesura-registry-0.1.0.jar"]
    ports:
      - "8761:8761"

  caesura-config:
    build:
      context: .
      dockerfile: Dockerfile
    image: caesura/config:0.1.0
    working_dir: /workspace/services/spring
    volumes:
      - ../..:/workspace
    command: ["java", "-jar", "caesura-config/target/caesura-config-0.1.0.jar"]
    ports:
      - "8888:8888"

  caesura-gate:
    build:
      context: .
      dockerfile: Dockerfile
    image: caesura/gate:0.1.0
    working_dir: /workspace/services/spring
    volumes:
      - ../..:/workspace
    environment:
      # 容器里配置服务器在 compose 网络里，不在 127.0.0.1
      CAESURA_CONFIG_URL: "http://caesura-config:8888"
    depends_on:
      - caesura-config
      - caesura-registry
    command: ["java", "-jar", "caesura-gate/target/caesura-gate-0.1.0.jar", "--eureka.client.service-url.defaultZone=http://caesura-registry:8761/eureka/", "--eureka.instance.hostname=caesura-gate"]
    ports:
      - "8081:8081"

  caesura-report:
    build:
      context: .
      dockerfile: Dockerfile
    image: caesura/report:0.1.0
    working_dir: /workspace/services/spring
    volumes:
      - ../..:/workspace
    depends_on:
      - caesura-gate
      - caesura-registry
    command: ["java", "-jar", "caesura-report/target/caesura-report-0.1.0.jar", "--eureka.client.service-url.defaultZone=http://caesura-registry:8761/eureka/", "--eureka.instance.hostname=caesura-report"]
    ports:
      - "8082:8082"

  caesura-client:
    build:
      context: .
      dockerfile: Dockerfile
    image: caesura/client:0.1.0
    working_dir: /workspace/services/spring
    volumes:
      - ../..:/workspace
    environment:
      CAESURA_CONFIG_URL: "http://caesura-config:8888"
    depends_on:
      - caesura-config
      - caesura-registry
    command: ["java", "-jar", "caesura-client/target/caesura-client-0.1.0.jar", "--eureka.client.service-url.defaultZone=http://caesura-registry:8761/eureka/", "--eureka.instance.hostname=caesura-client"]
    ports:
      - "8083:8083"

  caesura-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: caesura/gateway:0.1.0
    working_dir: /workspace/services/spring
    volumes:
      - ../..:/workspace
    depends_on:
      - caesura-gate
      - caesura-report
      - caesura-registry
    command: ["java", "-jar", "caesura-gateway/target/caesura-gateway-0.1.0.jar", "--eureka.client.service-url.defaultZone=http://caesura-registry:8761/eureka/", "--eureka.instance.hostname=caesura-gateway"]
    ports:
      - "8099:8099"
