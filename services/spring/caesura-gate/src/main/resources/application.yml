# caesura-gate（门执行器）—— KI-422
#
# 门名册**不在这里**：它由 caesura-config（配置服务器）供出来，这一行 import 就是唯一的取法。
# `spring.config.import` 刻意**不是** optional —— 配置服务器拿不到 ⇒ 这个服务起不来。
# 一个没有名册的门执行器不是门执行器。
#
# `context-path: /gate` 让服务自己那层与网关那一层同形：直连是 /gate/gates，
# 走网关（Path=/gate/**）转发过来也是 /gate/gates ⇒ 两条路给出同一份形状。

server:
  port: 8081
  servlet:
    context-path: /gate

caesura:
  circuit:
    # 熔断参数（KI-429）——**编排参数**，住这里不住配置服务器那份名册：
    # 名册只装**判定**（门 id／命令／参数表／上限／是否阻塞），编排参数塞进去
    # 会让「名册」这个词失去意思（重试参数也是这么分的）。
    # 连着坏几道就开闸：开闸之后**一个进程都不起**，直回一个「熔断中」的判决；
    # 冷却过去再放一道**试探**过去——试探绿了就闭合，败了就重新开闸。
    # 这两个数是**唯一出处**：Java 源码里不许再写一遍（判据 spring-family-rules 盯着这件事）。
    failure-threshold: 3
    cooldown-sec: 120

spring:
  application:
    name: caesura-gate
  config:
    import: "configserver:${CAESURA_CONFIG_URL:http://127.0.0.1:8888}"
  cloud:
    config:
      name: caesura-gates
      fail-fast: true

eureka:
  instance:
    hostname: 127.0.0.1
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka/
    registry-fetch-interval-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,bus-refresh
