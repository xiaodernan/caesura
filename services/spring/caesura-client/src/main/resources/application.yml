# caesura-client application.yml —— 本地兜底配置（配置服务器不可用时的退路）
spring:
  application:
    name: caesura-client
  config:
    # Spring Cloud Config 2022 起没有 `spring.config.import` 就不启动（"No spring.config.import property has been defined"）。
    # `optional:` 保留本地兜底：配置服务器不可用（或没有 caesura-client 的配置段）时不阻断启动（KI-447 同口径）。
    import: optional:configserver:${CAESURA_CONFIG_URL:http://localhost:8888}

server:
  port: 8083

# 与 Node 侧约定：caesura-client 不持有任何业务判据，只做编排与报告。
# 所有阈值（熔断上限、重试次数、画质档位、粒子预算）由 Node 侧的
# settings/Quality.ts 与 scripts/spring-family-rules.mjs 统一拍板。
caesura:
  client:
    role: "config-client-demo"
    version: "0.1.0"
    orchestrationOnly: true
