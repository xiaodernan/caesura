<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CAESURA 止音纪元</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#07080c; }
  #app { position:fixed; inset:0; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
          font-family:Georgia, "Songti SC", "STSong", "SimSun", serif; z-index:10;
          font-size:30px; letter-spacing:.4em; color:#c9b458;
          background: radial-gradient(ellipse 68% 56% at 50% 46%, #131622 0%, #0b0d13 55%, #07080c 100%); }
  #boot::before { content:''; position:absolute; top:50%; left:50%; width:300px; height:300px; border-radius:50%;
          transform: translate(-50%, -50%);
          border:1px solid rgba(201,180,88,.32);
          box-shadow: 0 0 0 12px rgba(201,180,88,.05), inset 0 0 0 1px rgba(201,180,88,.18), inset 0 0 60px rgba(255,184,107,.06), 0 0 46px rgba(255,184,107,.10); }
  #boot::after { content:''; position:absolute; top:50%; left:50%; width:7px; height:7px; border-radius:50%;
          transform: translate(-50%, -50%) translateY(-116px);
          background:#ffb86b; opacity:.85;
          box-shadow:0 0 10px 3px rgba(255,184,107,.55);
          animation: boot-ember 2.4s ease-in-out infinite; }
  @keyframes boot-ember { 0%,100% { opacity:.35 } 50% { opacity:.95 } }
  #boot .word { position:relative; z-index:1;
          background: linear-gradient(180deg, #fbf3dc 8%, #d8c36a 36%, #8f7f43 72%, #e3cf8f 100%);
          -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
  #boot small { font-size:11px; letter-spacing:.72em; text-indent:.72em; color: rgba(201,180,88,.45); }
  @media (prefers-reduced-motion: reduce) { #boot::after { animation:none; } }
</style>
</head>
<body>
  <div id="app"></div>
  <canvas id="hud"></canvas>
  <div id="boot"><span class="word">CAESURA</span><small>止音纪元</small></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
